name: Garmin Sync

on:
  schedule:
    - cron: '23 4 * * *'
    - cron: '17 11 * * *'
  workflow_dispatch:
    inputs:
      days:
        description: 'Nombre de jours a recuperer (activites)'
        required: false
        default: '60'
      sleep_days:
        description: 'Nombre de nuits de sommeil'
        required: false
        default: '4000'

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v5

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install garminconnect python-dotenv

      - name: Run sync
        env:
          GARMIN_EMAIL: ${{ secrets.GARMIN_EMAIL }}
          GARMIN_PASSWORD: ${{ secrets.GARMIN_PASSWORD }}
        run: python garmin_to_sessions.py --days ${{ github.event.inputs.days || 60 }} --sleep-days ${{ github.event.inputs.sleep_days || 14 }}

      - name: Commit if changed
        if: always()
        run: |
          git config user.name "Garmin Bot"
          git config user.email "bot@github.com"
          git add -A data/
          if git diff --staged --quiet; then
            echo "Aucun changement a enregistrer."
            exit 0
          fi
          git commit -m "sync: Garmin activities $(date +%Y-%m-%d)"
          for i in 1 2 3 4 5; do
            if git push; then echo "Push OK"; exit 0; fi
            echo "Push rejete, tentative $i/5"
            git pull --rebase --autostash origin main || git rebase --abort || true
            sleep 5
          done
          echo "::error::Echec du push apres 5 tentatives"
          exit 1
